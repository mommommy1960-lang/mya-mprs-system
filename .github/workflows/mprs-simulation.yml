name: MPRS Rescue Simulation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_safety_controller.py
      - run: python tools/test_campaign_engine.py
      - uses: actions/upload-artifact@v4
        with:
          name: mprs-simulation-evidence
          path: reports/campaign_safety.json
